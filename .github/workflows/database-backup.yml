name: Database Backup (Off-Site)

on:
  schedule:
    # Run twice daily at 02:00 UTC and 14:00 UTC
    - cron: '0 2,14 * * *'
  workflow_dispatch: # Allows manual one-click backup from GitHub Actions UI

jobs:
  backup:
    name: Dump & Upload to Off-Site Storage
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Validate Secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL is not configured in GitHub Secrets."
            exit 1
          fi
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET_NAME" ]; then
            echo "::error::Cloudflare R2 secrets (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID, R2_BUCKET_NAME) are not configured."
            exit 1
          fi
          echo "All required backup secrets are present."

      - name: Execute pg_dump & Compress
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%SZ")
          BACKUP_FILENAME="splitacharter_backup_${TIMESTAMP}.sql.gz"
          echo "BACKUP_FILENAME=${BACKUP_FILENAME}" >> $GITHUB_ENV

          echo "Starting pg_dump at $(date -u)..."
          pg_dump "$SUPABASE_DB_URL" \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            --format=plain \
            | gzip -9 > "$BACKUP_FILENAME"

          FILE_SIZE=$(du -h "$BACKUP_FILENAME" | cut -f1)
          echo "Backup created successfully: $BACKUP_FILENAME ($FILE_SIZE)"

      - name: Upload Backup to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "Uploading $BACKUP_FILENAME to s3://${R2_BUCKET_NAME}/backups/..."

          aws s3 cp "$BACKUP_FILENAME" \
            "s3://${R2_BUCKET_NAME}/backups/${BACKUP_FILENAME}" \
            --endpoint-url "$ENDPOINT"

          echo "Upload complete: s3://${R2_BUCKET_NAME}/backups/${BACKUP_FILENAME}"

      - name: Prune Backups Older than 14 Days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          CUTOFF_DATE=$(date -u -d "14 days ago" +"%Y-%m-%d")
          echo "Cleaning up backup snapshots older than $CUTOFF_DATE..."

          # List files, filter older dates, and delete
          aws s3 ls "s3://${R2_BUCKET_NAME}/backups/" --endpoint-url "$ENDPOINT" | while read -r line; do
            FILE_DATE=$(echo "$line" | awk '{print $1}')
            FILE_NAME=$(echo "$line" | awk '{print $4}')
            if [[ -n "$FILE_NAME" && "$FILE_DATE" < "$CUTOFF_DATE" ]]; then
              echo "Pruning expired backup: $FILE_NAME (date: $FILE_DATE)"
              aws s3 rm "s3://${R2_BUCKET_NAME}/backups/${FILE_NAME}" --endpoint-url "$ENDPOINT"
            fi
          done
          echo "Retention pruning completed."
